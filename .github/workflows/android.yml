name: Android APK

on:
  push:
    paths: ["android/**", "internal/**", "cmd/**", "testdata/**", "go.mod", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "internal/**", "cmd/**", "testdata/**", "go.mod", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  aria-go:
    # Módulos ARIA en Go (mismos casos de prueba que la app).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK (plataforma 36)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Tests del núcleo
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug -PspotifyClientId="${{ vars.SPOTIFY_CLIENT_ID }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cookie-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  device-tests:
    # Arranca la app en un emulador real y prueba el cifrado con el Keystore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
